<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1110" viewBox="0 0 960 1110" role="img" aria-labelledby="t d"><title id="t">From shift roster to completed visit</title><desc id="d">Three panels follow appointment booking, clinical care, and the separate lifecycle of a resource request. Cancelling a reservation returns its request to approved.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#526a80"/></marker></defs><rect width="960" height="1110" fill="#f3f5f5"/><rect x="0" y="0" width="960" height="111" rx="0" fill="#152d44"/><text x="35" y="49" font-family="Arial, sans-serif" font-weight="700" font-size="34" fill="white">From shift roster to completed visit</text><text x="36" y="84" font-family="Arial, sans-serif" font-weight="400" font-size="18" fill="#d4e8ed">Follow one appointment, then trace the separate request a doctor can open during care.</text><rect x="18" y="126" width="924" height="279" rx="15" fill="#fff"/><text x="42" y="163" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#467a79">01</text><text x="90" y="163" font-family="Arial, sans-serif" font-weight="700" font-size="25" fill="#18304b">Find a time both calendars can accept</text><rect x="42" y="188" width="260" height="94" rx="8" fill="#e8e3fa"/><text x="55" y="211" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#3a5065">MEDICAL MANAGER</text><text x="55" y="239" font-family="Arial, sans-serif" font-weight="700" font-size="19" fill="#102a42">Publish a doctor shift</text><text x="55" y="264" font-family="Arial, sans-serif" font-weight="400" font-size="15" fill="#18304b">Sets the bookable window.</text><rect x="348" y="188" width="260" height="94" rx="8" fill="#dbf1eb"/><text x="361" y="211" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#3a5065">PATIENT</text><text x="361" y="239" font-family="Arial, sans-serif" font-weight="700" font-size="19" fill="#102a42">Choose a slot</text><text x="361" y="264" font-family="Arial, sans-serif" font-weight="400" font-size="15" fill="#18304b">Select a doctor, date and time.</text><rect x="654" y="188" width="260" height="94" rx="8" fill="#e9eef1"/><text x="667" y="211" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#3a5065">BOOKING MANAGER</text><text x="667" y="239" font-family="Arial, sans-serif" font-weight="700" font-size="19" fill="#102a42">Confirm the booking</text><text x="667" y="264" font-family="Arial, sans-serif" font-weight="400" font-size="15" fill="#18304b">Check shift and both calendars.</text><path d="M303 232H343" fill="none" stroke="#526a80" stroke-width="2.2"  marker-end="url(#arrow)"/><path d="M609 232H649" fill="none" stroke="#526a80" stroke-width="2.2"  marker-end="url(#arrow)"/><path d="M775 283V305H484V285" fill="none" stroke="#526a80" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="533" y="328" font-family="Arial, sans-serif" font-weight="400" font-size="16" fill="#18304b">Slot unavailable → choose another time</text><text x="43" y="360" font-family="Arial, sans-serif" font-weight="700" font-size="17" fill="#18304b">After confirmation</text><text x="43" y="384" font-family="Arial, sans-serif" font-weight="400" font-size="16" fill="#18304b">An open booking can move to a free time in the doctor’s shift. The patient, doctor or admin can cancel it.</text><rect x="18" y="420" width="924" height="279" rx="15" fill="#fff"/><text x="42" y="457" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#467a79">02</text><text x="90" y="457" font-family="Arial, sans-serif" font-weight="700" font-size="25" fill="#18304b">Document the visit and release its results</text><rect x="42" y="484" width="260" height="94" rx="8" fill="#deebfa"/><text x="55" y="507" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#3a5065">ASSIGNED DOCTOR</text><text x="55" y="535" font-family="Arial, sans-serif" font-weight="700" font-size="19" fill="#102a42">Open the record</text><text x="55" y="560" font-family="Arial, sans-serif" font-weight="400" font-size="15" fill="#18304b">Linked to patient and appointment.</text><rect x="348" y="484" width="260" height="94" rx="8" fill="#deebfa"/><text x="361" y="507" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#3a5065">DOCTOR</text><text x="361" y="535" font-family="Arial, sans-serif" font-weight="700" font-size="19" fill="#102a42">Record care</text><text x="361" y="560" font-family="Arial, sans-serif" font-weight="400" font-size="15" fill="#18304b">Vitals, notes and prescriptions.</text><rect x="654" y="484" width="260" height="94" rx="8" fill="#deebfa"/><text x="667" y="507" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#3a5065">DOCTOR</text><text x="667" y="535" font-family="Arial, sans-serif" font-weight="700" font-size="19" fill="#102a42">Finalize the record</text><text x="667" y="560" font-family="Arial, sans-serif" font-weight="400" font-size="15" fill="#18304b">Consultation notes are required.</text><path d="M303 528H343" fill="none" stroke="#526a80" stroke-width="2.2"  marker-end="url(#arrow)"/><path d="M609 528H649" fill="none" stroke="#526a80" stroke-width="2.2"  marker-end="url(#arrow)"/><path d="M480 578V603" fill="none" stroke="#526a80" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="330" y="632" font-family="Arial, sans-serif" font-weight="700" font-size="17" fill="#96561b">Optional lab or imaging request</text><text x="331" y="656" font-family="Arial, sans-serif" font-weight="400" font-size="16" fill="#18304b">Continue to panel 03.</text><path d="M785 578V603" fill="none" stroke="#526a80" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="654" y="632" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#176952">Completed visit</text><text x="654" y="655" font-family="Arial, sans-serif" font-weight="400" font-size="16" fill="#18304b">History, rating and billing¹</text><rect x="18" y="715" width="924" height="308" rx="15" fill="#fff"/><text x="42" y="752" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#467a79">03</text><text x="90" y="752" font-family="Arial, sans-serif" font-weight="700" font-size="25" fill="#18304b">Approve a request and reserve a suitable asset</text><rect x="42" y="782" width="260" height="94" rx="8" fill="#fae9d3"/><text x="55" y="805" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#3a5065">DOCTOR → ADMIN STAFF</text><text x="55" y="833" font-family="Arial, sans-serif" font-weight="700" font-size="19" fill="#102a42">Pending request</text><text x="55" y="858" font-family="Arial, sans-serif" font-weight="400" font-size="15" fill="#18304b">Review the requested service.</text><rect x="348" y="782" width="260" height="94" rx="8" fill="#fae9d3"/><text x="361" y="805" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#3a5065">ADMIN STAFF</text><text x="361" y="833" font-family="Arial, sans-serif" font-weight="700" font-size="19" fill="#102a42">Approved request</text><text x="361" y="858" font-family="Arial, sans-serif" font-weight="400" font-size="15" fill="#18304b">Select an available matching asset.</text><rect x="654" y="782" width="260" height="94" rx="8" fill="#fae9d3"/><text x="667" y="805" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#3a5065">ADMIN STAFF</text><text x="667" y="833" font-family="Arial, sans-serif" font-weight="700" font-size="19" fill="#102a42">Allocated request</text><text x="667" y="858" font-family="Arial, sans-serif" font-weight="400" font-size="15" fill="#18304b">Reserve the asset for a time window.</text><path d="M303 829H343" fill="none" stroke="#526a80" stroke-width="2.2"  marker-end="url(#arrow)"/><path d="M609 829H649" fill="none" stroke="#526a80" stroke-width="2.2"  marker-end="url(#arrow)"/><path d="M170 877V912" fill="none" stroke="#526a80" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="44" y="941" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#8b4932">Rejected</text><text x="44" y="965" font-family="Arial, sans-serif" font-weight="400" font-size="16" fill="#18304b">Staff record a reason.</text><path d="M780 877V900H480V878" fill="none" stroke="#526a80" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="370" y="938" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#96561b">Cancel reservation</text><text x="370" y="963" font-family="Arial, sans-serif" font-weight="400" font-size="16" fill="#18304b">Request returns to approved.</text><path d="M858 877V912" fill="none" stroke="#526a80" stroke-width="2.2"  marker-end="url(#arrow)"/><text x="664" y="940" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#176952">Completed</text><text x="664" y="965" font-family="Arial, sans-serif" font-weight="400" font-size="16" fill="#18304b">Close allocation and request.</text><text x="35" y="1060" font-family="Arial, sans-serif" font-weight="400" font-size="15" fill="#18304b">¹ With billing configured, finalization uses the active consultation rate. Feedback requires a completed visit.</text><text x="35" y="1087" font-family="Arial, sans-serif" font-weight="400" font-size="15" fill="#18304b">Solid arrows show progression or closure. Dashed arrows show a retry or return to an earlier state.</text></svg>
